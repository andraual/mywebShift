<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Plantões Médicos</title>
    <!-- load Inter from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos gerais */
        body {
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #222;
            background: linear-gradient(180deg, #fff5f9 0%, #fff 60%);
            margin: 0;
            padding: 20px;
            font-size: 15px;
            line-height: 1.45;
        }
        h1, h2, h3 { font-weight: 700; margin: 0 0 12px 0; }
        .main-btn span { font-weight: 600; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(255, 102, 170, 0.08);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .container:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(255,102,170,0.08); }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            opacity: 0.95;
        }        .full-width {
            grid-column: 1 / -1;
        }
        
        /* Estilos para recorrência */
        #recorrenciaGroup {
            background: linear-gradient(180deg, #fff9fc, #fff);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 102, 170, 0.15);
            margin-top: 10px;
        }
        
        #recorrenciaGroup .form-group {
            margin-bottom: 12px;
        }
          .recorrencia-info {
            background: rgba(255, 102, 170, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
        
        /* Destaque quando recorrência está ativa */
        #recorrenteCheck:checked + label {
            color: #ff4d94;
            font-weight: 600;
        }
        
        .form-group button[type="submit"] {
            background: linear-gradient(90deg, #ff7bb3 0%, #ff4d94 100%);
            transition: all 0.2s ease;
        }
        
        #recorrenteCheck:checked ~ .full-width button[type="submit"] {
            background: linear-gradient(90deg, #28a745 0%, #20c997 100%);
        }
        
        #recorrenteCheck:checked ~ .full-width button[type="submit"]::after {
            content: " (Múltiplos)";
        }#calendar {
            width: 100%;
            /* altura flexível que se adapta ao conteúdo */
            min-height: 520px;
            height: auto;
            /* remove rolagem para permitir expansão completa */
            overflow: visible;
            z-index: 1;
        }
        .tab-content {
            overflow: auto;
        }
        .summary-header {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: end;
            margin-bottom: 20px;
            width: 100%;
            justify-items: stretch;
        }
        .summary-header .form-group {
            margin-bottom: 0;
        }
        .summary-item {
            margin-bottom: 20px;
            background: linear-gradient(180deg,#fff,#fffaf6);
            padding:14px;
            border-radius:10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
        }

        /* Página inicial */
        #inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px 0;
        }
        #inicio h2 {
            margin-bottom: 20px;
        }
        .main-btns {
            display:flex;
            gap:18px;
            flex-wrap:wrap;
        }
        .main-btn {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 180px;
            min-height: 100px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            box-shadow: 0 8px 20px rgba(255,77,148,0.12);
            cursor:pointer;
            transition: transform .14s ease, box-shadow .14s ease, opacity .14s;
            text-decoration: none;
        }
        .main-btn svg { filter: drop-shadow(0 6px 18px rgba(255,77,148,0.12)); }
        .main-btn span { margin-top:10px; font-weight:600; font-size:15px; }

        /* hover / active */
        .main-btn:hover { transform: translateY(-4px); box-shadow: 0 22px 40px rgba(255,77,148,0.14); }
        .main-btn:active { transform: translateY(-1px); }

        /* secondary logout button */
        button.logout-btn {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.08);
            color: #333;
            padding:8px 12px;
            border-radius:10px;
        }        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            form {
                grid-template-columns: 1fr; /* Ajusta para uma única coluna */
            }
            .summary-header {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .main-btns {
                flex-direction: column;
                gap: 20px;
            }
            #calendar {
                /* Remove altura fixa e permite expansão automática */
                height: auto !important;
                min-height: 400px;
                overflow: visible !important;
            }
        }

        /* alterado: breakpoint de 480px -> 390px */
        @media (max-width: 390px) {
            h1 {
                font-size: 20px; /* Reduz o tamanho do título */
            }
            button {
                font-size: 14px; /* Ajusta o tamanho do botão */
                padding: 8px 10px; /* Ajusta o espaçamento do botão */
            }
            .main-btns button {
                font-size: 15px;
                padding: 12px 10px;
            }
        }

        /* Estilos para a tela de login */
        #login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #login div {
            background: white;
            padding: 32px 24px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            min-width: 320px;
        }
        #login h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        #login button {
            width: 100%;
        }
        #loginErro {
            color: red;
            margin-top: 12px;
            text-align: center;
        }

        /* --- adicione ao final do <style> existente --- */
    /* Responsividade para as tabelas do resumo: voltar ao comportamento de tabela
       e apenas redimensionar / permitir scroll horizontal em telas pequenas. */
    /* ajustado: removida coluna "Entrada" e realinhado índices de colunas */
    .resumo-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .summary-item table {
        font-size: 13px;
        /* table-layout: fixed;  <-- removido para comportamento fluido */
        min-width: 0;
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
    }
    .summary-item th, .summary-item td {
        padding: 6px 6px;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #eee;
    }
    .summary-item thead th { background: rgba(255,77,148,0.04); font-weight:600; }

    /* Colunas mais estreitas */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { /* Dia */
        width: 30px;
        max-width: 30px;
        text-align: left;
        padding-right: 8px;
    }

    /* Horas e Valor Total (mantém compactos) */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { /* Horas */
        width: 30px;
        max-width: 30px;
        text-align: center;
    }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { /* Valor Total */
        width: 30px;
        max-width: 30px;
        text-align: right;
        white-space: nowrap;
    }

    /* responsividade ajustada para novos valores */
    @media (max-width: 1024px) {
        .summary-item th:nth-child(1), .summary-item td:nth-child(1) { width: 28px; max-width:28px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 44px; max-width:44px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 88px; max-width:88px; }
    }
    /* alterado: breakpoint de 480px -> 390px */
    @media (max-width: 390px) {
        .summary-item th:nth-child(1), .summary-item td:nth-child(1) { width: 24px; max-width:24px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 36px; max-width:36px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 72px; max-width:72px; }
    }

    /* garante que textos longos não quebrem layout */
    .summary-item td { overflow: hidden; text-overflow: ellipsis; }

    /* Ajustes de fonte / largura em pontos de quebra (mantendo tabela) */
    @media (max-width: 1024px) {
        .summary-item table { font-size: 12px; min-width: 480px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 72px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 56px; }
    }
    @media (max-width: 768px) {
        .summary-item table { font-size: 11px; min-width: 420px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 64px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 48px; }
    }
    @media (max-width: 390px) {
        .summary-item table { font-size: 10px; min-width: 360px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 56px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 40px; }
    }

    /* Ajustes específicos para iPhone / Safari mobile */
    :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
    }
    html, body {
        height: 100%;
        -webkit-text-size-adjust: 100%; /* impede zoom automático em iOS */
        padding-top: calc(var(--safe-top));
        padding-bottom: calc(var(--safe-bottom));
    }

    .container {
        min-height: calc(100vh - 32px - var(--safe-top) - var(--safe-bottom));
        padding-left: 16px;
        padding-right: 16px;
    }

    /* touch targets maiores para iPhone */
    button, .main-btn {
        -webkit-tap-highlight-color: rgba(0,0,0,0.08);
        touch-action: manipulation;
    }

    /* inputs maiores no mobile */
    @media (max-width: 390px) {
        input, select, textarea, button {
            font-size: 16px;
        }
        .main-btn {
            min-height: 84px;
            padding: 14px;
            min-width: 140px;
        }        #calendar {
            /* Permite altura automática em dispositivos móveis */
            height: auto !important;
            min-height: 350px;
            overflow: visible !important;
        }
        .summary-item table { min-width: 360px; font-size: 11px; }
    }

    /* suaviza scrolling horiz. no iOS */
    .resumo-wrapper {
        -webkit-overflow-scrolling: touch;
        overflow-x: auto;
    }    /* Ajustes específicos do FullCalendar para dispositivos móveis */
    .fc-scroller { 
        -webkit-overflow-scrolling: touch;
    }
    
    /* Remove barras de rolagem do calendário em dispositivos móveis */
    @media (max-width: 768px) {
        .fc-view-container,
        .fc-view,
        .fc-month-view,
        .fc-scroller {
            overflow: visible !important;
            height: auto !important;
        }
        
        .fc-day-grid-container {
            height: auto !important;
        }
        
        /* Garante que o calendário se expanda completamente */
        .fc-month-view .fc-bg table,
        .fc-month-view .fc-content-skeleton table {
            height: auto !important;
        }
    }

    /* --- Responsividade para Resumo Financeiro --- */
    .resumo-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 16px 0;
    }
    .summary-item table {
      width: 100%;
      min-width: 280px;     /* permite encolher em smartphones */
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
    }
    .summary-item th, .summary-item td {
      padding: 6px 8px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid #eee;
    }
    .summary-item thead th {
      background: rgba(255,77,148,0.04);
      font-weight: 600;
    }

    /* colunas com largura base para desktop */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { width: 100px; }  /* Dia */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { width: 60px; text-align:center; } /* Horas */
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { width: 120px; text-align:right; } /* Valor Total */

    /* telas médias (tablets, laptops menores) */
    @media (max-width: 1024px) {
      .summary-item th, .summary-item td {
        font-size: 13px;
        padding: 5px 6px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 80px; }
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 50px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 100px; }
    }

    /* smartphones grandes e iPhone 15 Pro (~430px de largura) */
    @media (max-width: 430px) {
      .summary-item th, .summary-item td {
        font-size: 12px;
        padding: 4px 5px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 60px; }
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 40px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 90px; }
    }

    /* smartphones pequenos */
    @media (max-width: 360px) {
      .summary-item th, .summary-item td {
        font-size: 11px;
        padding: 3px 4px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 52px; } 
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 36px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 80px; }
    }

    /* centraliza o conteúdo da coluna "Horas" */
  .summary-item table th:nth-child(2),
  .summary-item table td:nth-child(2) {
    text-align: center;
  }

  /* --- Ajustes para o resumo financeiro --- */
  .summary-item table {
    /* usa auto layout para colunas se ajustarem ao conteúdo */
    table-layout: auto;
    min-width: 0;
  }

  /* primeira coluna (Dia) volta a se ajustar automaticamente */
  .summary-item th:nth-child(1),
  .summary-item td:nth-child(1) {
    width: auto !important;
    max-width: none !important;
  }

  /* centraliza e define largura mínima razoável para Horas */
  .summary-item th:nth-child(2),
  .summary-item td:nth-child(2) {
    width: 40px !important;
    max-width: 40px !important;
    text-align: center !important;
  }

  /* remove quaisquer larguras inválidas definidas anteriormente */
  @media (max-width: 360px) {
    /* corrige bloco com erro de "fiftyFore" removendo-o */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) {
      width: 52px !important;
      max-width: 52px !important;
    }
  }

  /* --- Ajuste para desktop: tabela fixa e colunas proporcionais --- */
  @media (min-width: 1025px) {
    .summary-item table {
      table-layout: fixed;    /* força colunas fixas em desktop */
      min-width: 360px;       /* garante largura mínima */
    }
    /* Dia, Horas e Valor Total em larguras adequadas */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { width: 100px; }
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { width: 60px; text-align: center; }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { width: 120px; text-align: right; }
  }

  /* --- Mobile: layout fluido e scroll se necessário --- */
  @media (max-width: 1024px) {
    .summary-item table {
      table-layout: auto;     /* deixa colunas fluírem em telas pequenas */
    }
  }

  /* === OVERRIDE DESKTOP: fixa colunas no resumo financeiro === */
  @media (min-width: 1025px) {
    /* remove scroll horizontal no desktop */
    .resumo-wrapper { overflow-x: hidden !important; }

    /* força layout fixo de colunas */
    .summary-item table {
      table-layout: fixed !important;
      width: 100% !important;
      min-width: 0 !important;
    }
    /* largura da coluna "Dia" */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) {
      width: 90px !important;
      max-width: 90px !important;
    }
    /* largura da coluna "Horas" e centraliza */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) {
      width: 60px !important;
      max-width: 60px !important;
      text-align: center !important;
    }
    /* largura da coluna "Valor Total" e alinha à direita */
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) {
      width: 120px !important;
      max-width: 120px !important;
      text-align: right !important;
    }
  }
    </style>

</head>
<body>
    <!-- Tela de Login (fora da .container) -->
    <div id="login" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">
        <div style="background:white; padding:32px 24px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.08); min-width:320px;">
            <h2 style="text-align:center; margin-bottom:24px;">Login</h2>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="loginEmail">E-mail:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group" style="margin-bottom:24px;">
                    <label for="loginSenha">Senha:</label>
                    <input type="password" id="loginSenha" required>
                </div>
                <button type="submit" style="width:100%;">Entrar</button>
            </form>
            <div id="loginErro" style="color:red; margin-top:12px; text-align:center;"></div>
        </div>
    </div>

    <!-- App principal -->
    <div class="container" style="display:none;">
        
        <!-- Página Inicial -->
        <div id="inicio" style="display:none;">
            <h2>Bem-vindo! O que deseja fazer?</h2>
            <div class="main-btns">
                <button class="main-btn" onclick="mostrarSecao('cadastro')" title="Cadastrar Novo Plantão">
                    <!-- ícone plus moderno -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="11" y="4" width="2" height="16" rx="1" fill="#fff"/>
                        <rect x="4" y="11" width="16" height="2" rx="1" fill="#fff"/>
                    </svg>
                    <span>Cadastrar</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('calendario')" title="Ver Calendário">
                    <!-- novo ícone calendário (outline mais moderno) -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="6" width="18" height="15" rx="2" stroke="rgba(255,255,255,0.14)" fill="rgba(255,255,255,0.06)"/>
                        <path d="M8 11h2M8 15h2M12 11h4M12 15h4" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Calendário</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('resumo')" title="Financeiro">
                    <!-- Ícone de gráfico de barras moderno -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="14" width="4" height="6" rx="1" fill="#fff"/>
                        <rect x="10" y="10" width="4" height="10" rx="1" fill="#fff"/>
                        <rect x="16" y="6" width="4" height="14" rx="1" fill="#fff"/>
                    </svg>
                    <span>Financeiro</span>
                </button>
            </div>
            <button onclick="firebase.auth().signOut()" class="logout-btn" style="float:right; margin-top:-10px;">Sair</button>
        </div>
        
        <!-- Seção de Cadastro -->
        <div id="cadastro" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Cadastrar Novo Plantão</h2>
            <form id="plantaoForm">
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="horaInicio">Hora de Início:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div class="form-group">
                    <label for="tempoPlantao">Tempo de Plantão (horas):</label>
                    <input type="number" id="tempoPlantao" step="0.1" required>

        function formatarDataBR(data) {
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');

        // Função auxiliar para criar data sem problemas de fuso horário
        function criarDataSegura(dataString) {
            const [ano, mes, dia] = dataString.split('-');
            return new Date(parseInt(ano), parseInt(mes) - 1, parseInt(dia));
        }

        // Função auxiliar para obter a posição da semana no mês (1ª, 2ª, 3ª, 4ª, 5ª)
        function obterPosicaoSemanaNoMes(data) {
            const diaSemana = data.getDay();
            const diaDoMes = data.getDate();
            const ano = data.getFullYear();
            const mes = data.getMonth();
            
            // Conta quantas vezes este dia da semana ocorreu até a data atual
            let contador = 0;
            for (let dia = 1; dia <= diaDoMes; dia++) {
                const dataAtual = new Date(ano, mes, dia);
                if (dataAtual.getDay() === diaSemana) {
                    contador++;
                    if (dia === diaDoMes) {
                        return contador;
                    }
                }
            }
            return contador;
        }// Função auxiliar para encontrar uma data específica baseada na posição da semana
        function obterDataPorPosicaoSemana(ano, mes, diaSemana, posicao) {
            let contador = 0;
            
            // Itera através de todos os dias do mês
            for (let dia = 1; dia <= 31; dia++) {
                const data = new Date(ano, mes, dia);
                
                // Se saiu do mês, não existe esta posição
                if (data.getMonth() !== mes) {
                    // Se estamos procurando pela última ocorrência (5ª) e não encontramos,
                    // retorna a última ocorrência que encontramos
                    if (posicao >= 5 && contador > 0) {
                        // Procura a última ocorrência do dia da semana no mês
                        for (let diaReverso = 31; diaReverso >= 1; diaReverso--) {
                            const dataReversa = new Date(ano, mes, diaReverso);
                            if (dataReversa.getMonth() === mes && dataReversa.getDay() === diaSemana) {
                                return dataReversa;
                            }
                        }
                    }
                    return null;
                }
                
                // Se encontrou o dia da semana correto
                if (data.getDay() === diaSemana) {
                    contador++;
                    if (contador === posicao) {
                        return data;
                    }
                }        }
        
        return null; // Não encontrou a posição
        }
        
        // Função para calcular datas de recorrência
        function calcularDatasRecorrencia() {
            const dataString = document.getElementById('data').value;
            const dataInicial = criarDataSegura(dataString);
            const tipo = document.getElementById('tipoRecorrencia').value;
            const quantidade = parseInt(document.getElementById('quantidadeRecorrencia').value) || 4;
            const dataFimInput = document.getElementById('dataFim').value;
            const dataFim = dataFimInput ? new Date(dataFimInput) : null;
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0); // Remove horário para comparar apenas datas
            
            const datas = [];
            const diaSemana = dataInicial.getDay(); // 0=Domingo, 1=Segunda, etc.
            
            if (tipo === 'semanal') {
                // Semanal: toda semana no mesmo dia
                let dataAtual = new Date(dataInicial);
                
                for (let i = 0; i < quantidade; i++) {
                    if (dataFim && dataAtual > dataFim) break;
                    if (dataAtual >= hoje) {
                        datas.push(new Date(dataAtual));
                    }
                    dataAtual.setDate(dataAtual.getDate() + 7);
                }
                
            } else if (tipo === 'quinzenal') {
                // Quinzenal: semana sim, semana não (a cada 14 dias)
                let dataAtual = new Date(dataInicial);
                
                for (let i = 0; i < quantidade; i++) {
                    if (dataFim && dataAtual > dataFim) break;
                    if (dataAtual >= hoje) {
                        datas.push(new Date(dataAtual));
                    }
                    dataAtual.setDate(dataAtual.getDate() + 14);
                }
                  } else if (tipo === 'mensal') {
                // Mensal: mesma posição da semana no mês (ex: toda 3ª quarta-feira)
                const posicaoSemana = obterPosicaoSemanaNoMes(dataInicial);
                let mesAtual = dataInicial.getMonth();
                let anoAtual = dataInicial.getFullYear();
                let plantoesCriados = 0;
                
                // Primeiro, adiciona a data inicial se for válida
                if (dataInicial >= hoje) {
                    datas.push(new Date(dataInicial));
                    plantoesCriados++;
                }
                
                // Avança para o próximo mês
                mesAtual++;
                if (mesAtual > 11) {
                    mesAtual = 0;
                    anoAtual++;
                }
                
                // Continua criando os plantões restantes
                while (plantoesCriados < quantidade) {
                    const dataCalculada = obterDataPorPosicaoSemana(anoAtual, mesAtual, diaSemana, posicaoSemana);
                    
                    if (!dataCalculada) {
                        // Se não existe esta posição no mês (ex: 5ª segunda), pula para o próximo mês
                        mesAtual++;
                        if (mesAtual > 11) {
                            mesAtual = 0;
                            anoAtual++;
                        }
                        continue;
                    }
                    
                    if (dataFim && dataCalculada > dataFim) break;
                    
                    datas.push(new Date(dataCalculada));
                    plantoesCriados++;
                      // Avança para o próximo mês
                    mesAtual++;
                    if (mesAtual > 11) {
                        mesAtual = 0;
                        anoAtual++;
                    }
                }
            }
            
            return datas;
        }

    const info = document.getElementById('recorrencia-info');

    const data = document.getElementById('data').value;

    const quantidade = document.getElementById('quantidadeRecorrencia').value;
    const dataFim = document.getElementById('dataFim').value;
      if (!data) {

    }
    
    const dataInicial = criarDataSegura(data);
    const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
    const posicoes = ['', '1ª', '2ª', '3ª', '4ª', '5ª'];
    let texto = '<strong>📅 Plantão Recorrente:</strong> ';
    
    if (tipo === 'semanal') {
        texto += `Toda ${diasSemana[dataInicial.getDay()]}`;
    } else if (tipo === 'quinzenal') {
        texto += `Toda ${diasSemana[dataInicial.getDay()]} (semana sim, semana não)`;
    } else if (tipo === 'mensal') {
        const posicao = obterPosicaoSemanaNoMes(dataInicial);
        texto += `Toda ${posicoes[posicao]} ${diasSemana[dataInicial.getDay()]} do mês`;
    }
      const datasCalculadas = calcularDatasRecorrencia();      if (dataFim) {
        const dataLimite = criarDataSegura(dataFim);
        texto += ` até ${formatarDataBR(dataLimite)} (${datasCalculadas.length} plantões)`;
    } else if (quantidade) {
        if (datasCalculadas.length > 0) {
            const ultimaData = datasCalculadas[datasCalculadas.length - 1];
            texto += ` (${datasCalculadas.length} plantões até ${formatarDataBR(ultimaData)})`;
        }
    }
      // Adiciona preview das próximas datas
    if (datasCalculadas.length > 0) {
        texto += '<br><small style="color: #888;">Próximas datas: ';
        const proximasDatas = datasCalculadas.slice(0, 3).map(d => formatarDataBR(d));
        texto += proximasDatas.join(', ');

}

function setResumoDefaults() {

    const ano = String(now.getFullYear());

    const mesSelect = document.getElementById('mesResumo');
    const anoSelect = document.getElementById('anoResumo');

    if (mesSelect) {
        mesSelect.value = mes;
    }
    if (anoSelect) {
        // adiciona o ano nas options caso não exista (ex.: ano futuro)
        const exists = Array.from(anoSelect.options).some(opt => opt.value === ano);
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = ano;
            opt.text = ano;
            anoSelect.appendChild(opt);
        }
        anoSelect.value = ano;
    }
}
