<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Plantões Médicos</title>
    <!-- load Inter from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos gerais */
        body {
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #222;
            background: linear-gradient(180deg, #fff5f9 0%, #fff 60%);
            margin: 0;
            padding: 20px;
            font-size: 15px;
            line-height: 1.45;
        }
        h1, h2, h3 { font-weight: 700; margin: 0 0 12px 0; }
        .main-btn span { font-weight: 600; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(255, 102, 170, 0.08);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .container:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(255,102,170,0.08); }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            opacity: 0.95;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        #calendar {
            width: 100%;
            /* altura mínima maior para evitar corte das linhas do mês */
            min-height: 520px;
            /* permite rolagem se necessário e evita que elementos sejam escondidos */
            overflow: auto;
            z-index: 1;
        }
        .tab-content {
            overflow: auto;
        }
        .summary-header {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: end;
            margin-bottom: 20px;
            width: 100%;
            justify-items: stretch;
        }
        .summary-header .form-group {
            margin-bottom: 0;
        }
        .summary-item {
            margin-bottom: 20px;
            background: linear-gradient(180deg,#fff,#fffaf6);
            padding:14px;
            border-radius:10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
        }

        /* Página inicial */
        #inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px 0;
        }
        #inicio h2 {
            margin-bottom: 20px;
        }
        .main-btns {
            display:flex;
            gap:18px;
            flex-wrap:wrap;
        }
        .main-btn {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 180px;
            min-height: 100px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            box-shadow: 0 8px 20px rgba(255,77,148,0.12);
            cursor:pointer;
            transition: transform .14s ease, box-shadow .14s ease, opacity .14s;
            text-decoration: none;
        }
        .main-btn svg { filter: drop-shadow(0 6px 18px rgba(255,77,148,0.12)); }
        .main-btn span { margin-top:10px; font-weight:600; font-size:15px; }

        /* hover / active */
        .main-btn:hover { transform: translateY(-4px); box-shadow: 0 22px 40px rgba(255,77,148,0.14); }
        .main-btn:active { transform: translateY(-1px); }

        /* secondary logout button */
        button.logout-btn {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.08);
            color: #333;
            padding:8px 12px;
            border-radius:10px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            form {
                grid-template-columns: 1fr; /* Ajusta para uma única coluna */
            }
            .summary-header {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .main-btns {
                flex-direction: column;
                gap: 20px;
            }
            #calendar {
                height: 400px; /* Reduz a altura do calendário em telas menores */
            }
        }

        /* alterado: breakpoint de 480px -> 390px */
        @media (max-width: 390px) {
            h1 {
                font-size: 20px; /* Reduz o tamanho do título */
            }
            button {
                font-size: 14px; /* Ajusta o tamanho do botão */
                padding: 8px 10px; /* Ajusta o espaçamento do botão */
            }
            .main-btns button {
                font-size: 15px;
                padding: 12px 10px;
            }
        }

        /* Estilos para a tela de login */
        #login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #login div {
            background: white;
            padding: 32px 24px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            min-width: 320px;
        }
        #login h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        #login button {
            width: 100%;
        }
        #loginErro {
            color: red;
            margin-top: 12px;
            text-align: center;
        }

        /* --- adicione ao final do <style> existente --- */
    /* Responsividade para as tabelas do resumo: voltar ao comportamento de tabela
       e apenas redimensionar / permitir scroll horizontal em telas pequenas. */
    /* ajustado: removida coluna "Entrada" e realinhado índices de colunas */
    .resumo-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .summary-item table {
        font-size: 13px;
        /* table-layout: fixed;  <-- removido para comportamento fluido */
        min-width: 0;
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
    }
    .summary-item th, .summary-item td {
        padding: 6px 6px;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #eee;
    }
    .summary-item thead th { background: rgba(255,77,148,0.04); font-weight:600; }

    /* Colunas mais estreitas */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { /* Dia */
        width: 30px;
        max-width: 30px;
        text-align: left;
        padding-right: 8px;
    }

    /* Horas e Valor Total (mantém compactos) */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { /* Horas */
        width: 30px;
        max-width: 30px;
        text-align: center;
    }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { /* Valor Total */
        width: 30px;
        max-width: 30px;
        text-align: right;
        white-space: nowrap;
    }

    /* responsividade ajustada para novos valores */
    @media (max-width: 1024px) {
        .summary-item th:nth-child(1), .summary-item td:nth-child(1) { width: 28px; max-width:28px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 44px; max-width:44px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 88px; max-width:88px; }
    }
    /* alterado: breakpoint de 480px -> 390px */
    @media (max-width: 390px) {
        .summary-item th:nth-child(1), .summary-item td:nth-child(1) { width: 24px; max-width:24px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 36px; max-width:36px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 72px; max-width:72px; }
    }

    /* garante que textos longos não quebrem layout */
    .summary-item td { overflow: hidden; text-overflow: ellipsis; }

    /* Ajustes de fonte / largura em pontos de quebra (mantendo tabela) */
    @media (max-width: 1024px) {
        .summary-item table { font-size: 12px; min-width: 480px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 72px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 56px; }
    }
    @media (max-width: 768px) {
        .summary-item table { font-size: 11px; min-width: 420px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 64px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 48px; }
    }
    @media (max-width: 390px) {
        .summary-item table { font-size: 10px; min-width: 360px; }
        .summary-item th:nth-child(2), .summary-item td:nth-child(2) { width: 56px; }
        .summary-item th:nth-child(3), .summary-item td:nth-child(3) { width: 40px; }
    }

    /* Ajustes específicos para iPhone / Safari mobile */
    :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
    }
    html, body {
        height: 100%;
        -webkit-text-size-adjust: 100%; /* impede zoom automático em iOS */
        padding-top: calc(var(--safe-top));
        padding-bottom: calc(var(--safe-bottom));
    }

    .container {
        min-height: calc(100vh - 32px - var(--safe-top) - var(--safe-bottom));
        padding-left: 16px;
        padding-right: 16px;
    }

    /* touch targets maiores para iPhone */
    button, .main-btn {
        -webkit-tap-highlight-color: rgba(0,0,0,0.08);
        touch-action: manipulation;
    }

    /* inputs maiores no mobile */
    @media (max-width: 390px) {
        input, select, textarea, button {
            font-size: 16px;
        }
        .main-btn {
            min-height: 84px;
            padding: 14px;
            min-width: 140px;
        }
        #calendar {
            min-height: 420px; /* um pouco menor para telas iPhone */
        }
        .summary-item table { min-width: 360px; font-size: 11px; }
    }

    /* suaviza scrolling horiz. no iOS */
    .resumo-wrapper {
        -webkit-overflow-scrolling: touch;
        overflow-x: auto;
    }

    /* evita que o calendário fique "cortado" em iOS quando a URL bar some/aparece */
    .fc-scroller { /* fullcalendar v3 uses internal scroller class on some views */
        -webkit-overflow-scrolling: touch;
    }

    /* --- Responsividade para Resumo Financeiro --- */
    .resumo-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 16px 0;
    }
    .summary-item table {
      width: 100%;
      min-width: 280px;     /* permite encolher em smartphones */
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
    }
    .summary-item th, .summary-item td {
      padding: 6px 8px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-bottom: 1px solid #eee;
    }
    .summary-item thead th {
      background: rgba(255,77,148,0.04);
      font-weight: 600;
    }

    /* colunas com largura base para desktop */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { width: 100px; }  /* Dia */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { width: 60px; text-align:center; } /* Horas */
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { width: 120px; text-align:right; } /* Valor Total */

    /* telas médias (tablets, laptops menores) */
    @media (max-width: 1024px) {
      .summary-item th, .summary-item td {
        font-size: 13px;
        padding: 5px 6px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 80px; }
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 50px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 100px; }
    }

    /* smartphones grandes e iPhone 15 Pro (~430px de largura) */
    @media (max-width: 430px) {
      .summary-item th, .summary-item td {
        font-size: 12px;
        padding: 4px 5px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 60px; }
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 40px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 90px; }
    }

    /* smartphones pequenos */
    @media (max-width: 360px) {
      .summary-item th, .summary-item td {
        font-size: 11px;
        padding: 3px 4px;
      }
      .summary-item th:nth-child(1),
      .summary-item td:nth-child(1) { width: 52px; } 
      .summary-item th:nth-child(2),
      .summary-item td:nth-child(2) { width: 36px; }
      .summary-item th:nth-child(3),
      .summary-item td:nth-child(3) { width: 80px; }
    }

    /* centraliza o conteúdo da coluna "Horas" */
  .summary-item table th:nth-child(2),
  .summary-item table td:nth-child(2) {
    text-align: center;
  }

  /* --- Ajustes para o resumo financeiro --- */
  .summary-item table {
    /* usa auto layout para colunas se ajustarem ao conteúdo */
    table-layout: auto;
    min-width: 0;
  }

  /* primeira coluna (Dia) volta a se ajustar automaticamente */
  .summary-item th:nth-child(1),
  .summary-item td:nth-child(1) {
    width: auto !important;
    max-width: none !important;
  }

  /* centraliza e define largura mínima razoável para Horas */
  .summary-item th:nth-child(2),
  .summary-item td:nth-child(2) {
    width: 40px !important;
    max-width: 40px !important;
    text-align: center !important;
  }

  /* remove quaisquer larguras inválidas definidas anteriormente */
  @media (max-width: 360px) {
    /* corrige bloco com erro de "fiftyFore" removendo-o */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) {
      width: 52px !important;
      max-width: 52px !important;
    }
  }

  /* --- Ajuste para desktop: tabela fixa e colunas proporcionais --- */
  @media (min-width: 1025px) {
    .summary-item table {
      table-layout: fixed;    /* força colunas fixas em desktop */
      min-width: 360px;       /* garante largura mínima */
    }
    /* Dia, Horas e Valor Total em larguras adequadas */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) { width: 100px; }
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) { width: 60px; text-align: center; }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) { width: 120px; text-align: right; }
  }

  /* --- Mobile: layout fluido e scroll se necessário --- */
  @media (max-width: 1024px) {
    .summary-item table {
      table-layout: auto;     /* deixa colunas fluírem em telas pequenas */
    }
  }

  /* === OVERRIDE DESKTOP: fixa colunas no resumo financeiro === */
  @media (min-width: 1025px) {
    /* remove scroll horizontal no desktop */
    .resumo-wrapper { overflow-x: hidden !important; }

    /* força layout fixo de colunas */
    .summary-item table {
      table-layout: fixed !important;
      width: 100% !important;
      min-width: 0 !important;
    }
    /* largura da coluna "Dia" */
    .summary-item th:nth-child(1),
    .summary-item td:nth-child(1) {
      width: 90px !important;
      max-width: 90px !important;
    }
    /* largura da coluna "Horas" e centraliza */
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) {
      width: 60px !important;
      max-width: 60px !important;
      text-align: center !important;
    }
    /* largura da coluna "Valor Total" e alinha à direita */
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) {
      width: 120px !important;
      max-width: 120px !important;
      text-align: right !important;
    }
  }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
</head>
<body>
    <!-- Tela de Login (fora da .container) -->
    <div id="login" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">
        <div style="background:white; padding:32px 24px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.08); min-width:320px;">
            <h2 style="text-align:center; margin-bottom:24px;">Login</h2>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="loginEmail">E-mail:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group" style="margin-bottom:24px;">
                    <label for="loginSenha">Senha:</label>
                    <input type="password" id="loginSenha" required>
                </div>
                <button type="submit" style="width:100%;">Entrar</button>
            </form>
            <div id="loginErro" style="color:red; margin-top:12px; text-align:center;"></div>
        </div>
    </div>

    <!-- App principal -->
    <div class="container" style="display:none;">
        
        <!-- Página Inicial -->
        <div id="inicio" style="display:none;">
            <h2>Bem-vindo! O que deseja fazer?</h2>
            <div class="main-btns">
                <button class="main-btn" onclick="mostrarSecao('cadastro')" title="Cadastrar Novo Plantão">
                    <!-- ícone plus moderno -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="11" y="4" width="2" height="16" rx="1" fill="#fff"/>
                        <rect x="4" y="11" width="16" height="2" rx="1" fill="#fff"/>
                    </svg>
                    <span>Cadastrar</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('calendario')" title="Ver Calendário">
                    <!-- novo ícone calendário (outline mais moderno) -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="6" width="18" height="15" rx="2" stroke="rgba(255,255,255,0.14)" fill="rgba(255,255,255,0.06)"/>
                        <path d="M8 11h2M8 15h2M12 11h4M12 15h4" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Calendário</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('resumo')" title="Financeiro">
                    <!-- ícone cifrão moderno (substituído) -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="rgba(255,255,255,0.08)"/>
                        <path d="M12 7v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 15v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 8.5c-1-.8-2.5-1-3.5-1-1 0-2.3.3-3.3 1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 15.5c1 .8 2.5 1 3.5 1 1 0 2.3-.3 3.3-1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Financeiro</span>
                </button>
            </div>
            <button onclick="firebase.auth().signOut()" class="logout-btn" style="float:right; margin-top:-10px;">Sair</button>
        </div>
        
        <!-- Seção de Cadastro -->
        <div id="cadastro" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Cadastrar Novo Plantão</h2>
            <form id="plantaoForm">
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="horaInicio">Hora de Início:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div class="form-group">
                    <label for="tempoPlantao">Tempo de Plantão (horas):</label>
                    <input type="number" id="tempoPlantao" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="local">Local:</label>
                    <select id="local" required>
                        <option value="Intermedica Diadema">Intermedica Diadema</option>
                        <option value="Beneficência Portuguesa SC">Beneficência Portuguesa SC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="valorHora">Valor por Hora (R$):</label>
                    <input type="number" id="valorHora" step="0.01" required>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="valorCheioCheck" style="width:auto;">
                    <label for="valorCheioCheck" style="margin:0;">Informar valor cheio do plantão</label>
                </div>
                <div class="form-group" id="valorCheioGroup" style="display:none;">
                    <label for="valorCheio">Valor Cheio do Plantão (R$):</label>
                    <input type="number" id="valorCheio" step="0.01">
                </div>
                <div class="form-group full-width">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" rows="3" style="width: 100%;"></textarea>
                </div>
                <div class="form-group full-width">
                    <button type="submit">Salvar Plantão</button>
                </div>
            </form>
        </div>
        
        <!-- Seção de Calendário -->
        <div id="calendario" style="display:none;">

        // Função para buscar plantões do Firestore e formatar para o calendário
        async function buscarPlantoes() {
            const user = firebase.auth().currentUser;
            if (!user) return [];
            const snapshot = await db.collection("plantoes").where("userId", "==", user.uid).get();
            const eventos = [];
            snapshot.forEach(doc => {
                const p = doc.data();
                eventos.push({
                    id: doc.id, // Inclui o ID do documento
                    title: `Plantão - ${p.local}`,
                    start: `${p.data}T${p.horaInicio}`,
                    end: moment(`${p.data}T${p.horaInicio}`).add(Number(p.tempoPlantao), 'hours').format('YYYY-MM-DDTHH:mm'),
                    local: p.local,
                    valorHora: p.valorHora,
                    horas: p.tempoPlantao,
                    total: (Number(p.valorHora) * Number(p.tempoPlantao)).toFixed(2),
                    observacoes: p.observacoes
                });
            });
            return eventos;

        // Função para filtrar o resumo financeiro
        async function filtrarResumo() {
            const mes = document.getElementById('mesResumo').value.padStart(2, '0');
            const ano = document.getElementById('anoResumo').value;
            const resumoContent = document.getElementById('resumoContent');
            const user = firebase.auth().currentUser;
            if (!user) {
                resumoContent.innerHTML = "<p>Usuário não autenticado.</p>";
                return;
            }

            const snapshot = await db.collection("plantoes").where("userId", "==", user.uid).get();
            const resumoPorLocal = {};

            snapshot.forEach(doc => {
                const p = doc.data();
                if (p.data && p.data.startsWith(`${ano}-${mes}`)) {
                    if (!resumoPorLocal[p.local]) {
                        resumoPorLocal[p.local] = { horas: 0, valor: 0, plantoes: [] };
                    }
                    const horas = Number(p.tempoPlantao) || 0;
                    const valorHora = Number(p.valorHora) || 0;
                    const valorTotal = p.valorTotal !== undefined ? Number(p.valorTotal) : (horas * valorHora);
                    resumoPorLocal[p.local].horas += horas;
                    resumoPorLocal[p.local].valor += valorTotal;
                    resumoPorLocal[p.local].plantoes.push({
                        id: doc.id,
                        data: p.data,
                        horaInicio: p.horaInicio || '',
                        tempoPlantao: horas,
                        valorHora: valorHora,
                        valorTotal: valorTotal,
                        local: p.local,
                        observacoes: p.observacoes || ''
                    });
                }
            });

            let html = '';
            Object.keys(resumoPorLocal).forEach(local => {
                resumoPorLocal[local].plantoes.sort((a, b) => {
                    if (a.data !== b.data) return a.data.localeCompare(b.data);
                    return (a.horaInicio || '').localeCompare(b.horaInicio || '');
                });

                html += `
                    <div class="summary-item">
                        <h3>${local}</h3>
                        <div class="resumo-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Dia</th>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Horas</th>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Valor Total</th>
                                    </tr>
                                </thead>
                                <tbody>
    ${resumoPorLocal[local].plantoes.map(p => `
        <tr onclick="abrirPopupResumo('${p.id}')" style="cursor:pointer;">
            <td style="padding:4px;">${p.data.split('-').reverse().join('/')}</td>
            <td style="padding:4px; text-align:center;">${p.tempoPlantao}</td>
            <td style="padding:4px; text-align:right;">${p.valorTotal ? 'R$ ' + Number(p.valorTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2}) : '-'}</td>
        </tr>
    `).join('')}
</tbody>
                            </table>
                        </div>
                        <p><strong>Total de horas:</strong> ${resumoPorLocal[local].horas}</p>
                        <p><strong>Valor total:</strong> R$ ${resumoPorLocal[local].valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                `;
            });

            if (!html) {
                html = `<p>Nenhum plantão encontrado para o período selecionado.</p>`;
            }

            resumoContent.innerHTML = html;

            // Atualiza o resumo total
            atualizarResumoTotal(resumoPorLocal);
        }

        // Mostrar/ocultar campo de valor cheio e calcular valorHora automaticamente
document.getElementById('valorCheioCheck').addEventListener('change', function() {
    const valorCheioGroup = document.getElementById('valorCheioGroup');
    const valorCheioInput = document.getElementById('valorCheio');
    const valorHoraInput = document.getElementById('valorHora');
    valorCheioGroup.style.display = this.checked ? 'block' : 'none';

// Sempre que o valor cheio ou tempo mudar, calcula o valorHora automaticamente se o checkbox estiver marcado
document.getElementById('valorCheio').addEventListener('input', function() {
    const tempo = parseFloat(document.getElementById('tempoPlantao').value);
    const valorCheio = parseFloat(this.value);
    const valorHoraInput = document.getElementById('valorHora');
    if (!isNaN(tempo) && tempo > 0 && !isNaN(valorCheio)) {
        valorHoraInput.value = (valorCheio / tempo).toFixed(2);
    }
});
document.getElementById('tempoPlantao').addEventListener('input', function() {
    const tempo = parseFloat(this.value);
    const valorCheio = parseFloat(document.getElementById('valorCheio').value);
    const valorHoraInput = document.getElementById('valorHora');
    if (document.getElementById('valorCheioCheck').checked && !isNaN(tempo) && tempo > 0 && !isNaN(valorCheio)) {
        valorHoraInput.value = (valorCheio / tempo).toFixed(2);
    }
});

// adiciona esta função no mesmo <script> (logo após mostrarSecao ou onde ficar melhor)
function setResumoDefaults() {
    const now = new Date();
    const mes = String(now.getMonth() + 1); // valores das options: "1".."12"
    const ano = String(now.getFullYear());

    const mesSelect = document.getElementById('mesResumo');
    const anoSelect = document.getElementById('anoResumo');

    if (mesSelect) {
        mesSelect.value = mes;
    }
    if (anoSelect) {
        // adiciona o ano nas options caso não exista (ex.: ano futuro)
        const exists = Array.from(anoSelect.options).some(opt => opt.value === ano);
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = ano;
            opt.text = ano;
            anoSelect.appendChild(opt);
        }
        anoSelect.value = ano;
    }
}

/* --- Adicionado: função para atualizar o resumo total --- */
function atualizarResumoTotal(resumoPorLocal) {
    let totalHoras = 0;
    let totalValor = 0;

    Object.keys(resumoPorLocal).forEach(local => {
        totalHoras += resumoPorLocal[local].horas;
        totalValor += resumoPorLocal[local].valor;
    });

    document.getElementById('totalHoras').textContent = totalHoras;
    document.getElementById('totalValor').textContent = totalValor.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

        modal.style.borderRadius = '8px';
        modal.style.boxShadow = '0 0 10px rgba(0,0,0,0.1)';
        modal.style.zIndex = '9999'; // Garante que o modal fique acima de outros elementos
        modal.innerHTML = confirmacao;

        modal.id = 'popupModal'; // Adiciona um ID ao modal para facilitar a manipulação
        document.body.appendChild(modal);
    } catch (error) {
        console.error("Erro ao buscar plantão:", error);
        alert("Erro ao buscar informações do plantão.");
    }
}

/* --- Adicionada função excluirPlantao --- */
async function excluirPlantao(plantaoId) {
    try {
        const confirmacao = confirm("Tem certeza que deseja excluir este plantão?");
        if (!confirmacao) return;

        await db.collection("plantoes").doc(plantaoId).delete();

        // Remove o popup após exclusão
        fecharPopup();

        // Redireciona para a tela de bem-vindo
        mostrarSecao('inicio');
    } catch (error) {
        console.error("Erro ao excluir plantão:", error);
    }
}

    <!-- Ajustes runtime específicos para iPhone / iOS Safari -->
    <script>
    (function(){
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function ajustarAlturaCalendarIOS() {
            if (!isIOS()) return;
            // calcula altura disponível usando innerHeight (corrige problema da URL bar)
            const headerFooter = 160; // ajustar conforme seu layout (botões + títulos)
            const h = Math.max(360, Math.round(window.innerHeight - headerFooter - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0)));
            try {
                $('#calendar').fullCalendar('option', 'height', h);
                $('#calendar').fullCalendar('render');
            } catch (e) {
                console.warn('Não foi possível ajustar altura do FullCalendar:', e);
            }
        }

        window.addEventListener('orientationchange', function(){ setTimeout(ajustarAlturaCalendarIOS, 500); });
        window.addEventListener('resize', function(){ setTimeout(ajustarAlturaCalendarIOS, 200); });

        // executa após inicialização do calendar (ele já chama atualizarCalendario em mostrarSecao)
        $(document).ready(function(){
            setTimeout(ajustarAlturaCalendarIOS, 600);
        });
    })();
    </script>
