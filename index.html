<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Plantões Médicos</title>
    <style>
        /* Estilos gerais */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        #calendar {
            width: 100%;
            height: auto; /* Ajusta a altura dinamicamente */
            min-height: 400px; /* Define uma altura mínima */
            overflow: hidden; /* Evita que o conteúdo ultrapasse os limites */
        }
        .tab-content {
            overflow: auto;
        }
        .summary-header {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .summary-item {
            margin-bottom: 20px;
        }

        /* Página inicial */
        #inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px 0;
        }
        #inicio h2 {
            margin-bottom: 20px;
        }
        .main-btns {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .main-btns button {
            min-width: 180px;
            font-size: 18px;
            padding: 18px 24px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            form {
                grid-template-columns: 1fr; /* Ajusta para uma única coluna */
            }
            .summary-header {
                flex-direction: column;
                gap: 10px;
            }
            .main-btns {
                flex-direction: column;
                gap: 20px;
            }
            #calendar {
                height: 400px; /* Reduz a altura do calendário em telas menores */
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px; /* Reduz o tamanho do título */
            }
            button {
                font-size: 14px; /* Ajusta o tamanho do botão */
                padding: 8px 10px; /* Ajusta o espaçamento do botão */
            }
            .main-btns button {
                font-size: 15px;
                padding: 12px 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
</head>
<body>
    <div class="container">
        <h1>Controle de Plantões Médicos</h1>
        
        <!-- Página Inicial -->
        <div id="inicio">
            <h2>Bem-vindo! O que deseja fazer?</h2>
            <div class="main-btns">
                <button onclick="mostrarSecao('cadastro')" title="Cadastrar Novo Plantão" style="display: flex; flex-direction: column; align-items: center;">
                    <!-- Ícone de mais (+) -->
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="22" stroke="#4CAF50" stroke-width="4" fill="#E8F5E9"/>
                        <rect x="22" y="12" width="4" height="24" rx="2" fill="#4CAF50"/>
                        <rect x="12" y="22" width="24" height="4" rx="2" fill="#4CAF50"/>
                    </svg>
                    <span style="margin-top:8px;">Cadastrar</span>
                </button>
                <button onclick="mostrarSecao('calendario')" title="Ver Calendário" style="display: flex; flex-direction: column; align-items: center;">
                    <!-- Ícone de calendário -->
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect x="6" y="10" width="36" height="32" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="4"/>
                        <rect x="14" y="20" width="8" height="8" rx="2" fill="#1976D2"/>
                        <rect x="26" y="20" width="8" height="8" rx="2" fill="#1976D2"/>
                        <rect x="14" y="32" width="8" height="8" rx="2" fill="#1976D2"/>
                        <rect x="26" y="32" width="8" height="8" rx="2" fill="#1976D2"/>
                        <rect x="12" y="6" width="4" height="8" rx="2" fill="#1976D2"/>
                        <rect x="32" y="6" width="4" height="8" rx="2" fill="#1976D2"/>
                    </svg>
                    <span style="margin-top:8px;">Calendário</span>
                </button>
                <button onclick="mostrarSecao('resumo')" title="Resumo Financeiro" style="display: flex; flex-direction: column; align-items: center;">
                    <!-- Ícone de cifrão ($) -->
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <circle cx="24" cy="24" r="22" stroke="#FFD600" stroke-width="4" fill="#FFFDE7"/>
                        <text x="24" y="32" text-anchor="middle" font-size="28" font-family="Arial" fill="#FFD600" font-weight="bold">$</text>
                    </svg>
                    <span style="margin-top:8px;">Resumo</span>
                </button>
            </div>
        </div>
        
        <!-- Seção de Cadastro -->
        <div id="cadastro" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Cadastrar Novo Plantão</h2>
            <form id="plantaoForm">
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="horaInicio">Hora de Início:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div class="form-group">
                    <label for="tempoPlantao">Tempo de Plantão (horas):</label>
                    <input type="number" id="tempoPlantao" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="local">Local:</label>
                    <select id="local" required>
                        <option value="Notredame Intermédia Diadema">Notredame Intermédia Diadema</option>
                        <option value="Beneficiencia Portuguesa de SCS">Beneficência Portuguesa de SCS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="valorHora">Valor por Hora (R$):</label>
                    <input type="number" id="valorHora" step="0.01" required>
                </div>
                <div class="form-group full-width">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" rows="3" style="width: 100%;"></textarea>
                </div>
                <div class="form-group full-width">
                    <button type="submit">Salvar Plantão</button>
                </div>
            </form>
        </div>
        
        <!-- Seção de Calendário -->
        <div id="calendario" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Calendário de Plantões</h2>
            <div id="calendar"></div>
        </div>
        
        <!-- Seção de Resumo Financeiro -->
        <div id="resumo" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Resumo Financeiro Mensal</h2>
            <div class="summary-header">
                <div class="form-group">
                    <label for="mesResumo">Selecione o Mês:</label>
                    <select id="mesResumo">
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="anoResumo">Ano:</label>
                    <select id="anoResumo">
                        <option value="2023">2023</option>
                        <option value="2024" selected>2024</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <button onclick="filtrarResumo()">Filtrar</button>
            </div>
            <div id="resumoContent">
                <!-- Aqui será carregado o resumo financeiro -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/locale/pt-br.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        // Função para navegação entre seções
        function mostrarSecao(secao) {
            document.getElementById('inicio').style.display = (secao === 'inicio') ? 'flex' : 'none';
            document.getElementById('cadastro').style.display = (secao === 'cadastro') ? 'block' : 'none';
            document.getElementById('calendario').style.display = (secao === 'calendario') ? 'block' : 'none';
            document.getElementById('resumo').style.display = (secao === 'resumo') ? 'block' : 'none';
            // Atualiza o calendário ao entrar na tela
            if (secao === 'calendario' && window.atualizarCalendario) {
                window.atualizarCalendario();
            }
            // Atualiza o resumo ao entrar na tela
            if (secao === 'resumo') {
                filtrarResumo();
            }
        }

        // Inicialização do Firebase usando a API compatível
        const firebaseConfig = {
            apiKey: "AIzaSyCPCsCD_UwBk_c4weCgTi8r0JyhdQThrZQ",
            authDomain: "mywebshift.firebaseapp.com",
            projectId: "mywebshift",
            storageBucket: "mywebshift.appspot.com",
            messagingSenderId: "994220258656",
            appId: "1:994220258656:web:4686ab749f948e3ae19a05",
            measurementId: "G-LF8XYGQ7M2"
        };

        firebase.initializeApp(firebaseConfig);
        firebase.analytics();
        const db = firebase.firestore();

        // Função para buscar plantões do Firestore e formatar para o calendário
        async function buscarPlantoes() {
            const snapshot = await db.collection("plantoes").get();
            const eventos = [];
            snapshot.forEach(doc => {
                const p = doc.data();
                eventos.push({
                    title: `Plantão - ${p.local}`,
                    start: `${p.data}T${p.horaInicio}`,
                    end: moment(`${p.data}T${p.horaInicio}`).add(Number(p.tempoPlantao), 'hours').format('YYYY-MM-DDTHH:mm'),
                    local: p.local,
                    valorHora: p.valorHora,
                    horas: p.tempoPlantao,
                    total: (Number(p.valorHora) * Number(p.tempoPlantao)).toFixed(2),
                    observacoes: p.observacoes
                });
            });
            return eventos;
        }

        // Inicializa o calendário
        $(document).ready(function() {
            // Inicializa o calendário vazio
            $('#calendar').fullCalendar({
                locale: 'pt-br',
                header: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'month,agendaWeek,agendaDay'
                },
                defaultView: 'month',
                editable: false,
                eventLimit: true,
                events: [],
                eventClick: function(calEvent, jsEvent, view) {
                    alert(
                        'Plantão: ' + calEvent.title +
                        '\nLocal: ' + calEvent.local +
                        '\nValor por hora: R$ ' + calEvent.valorHora +
                        '\nTotal: R$ ' + calEvent.total +
                        (calEvent.observacoes ? '\nObservações: ' + calEvent.observacoes : '')
                    );
                }
            });

            // Função global para atualizar o calendário ao entrar na tela
            window.atualizarCalendario = async function() {
                const eventos = await buscarPlantoes();
                $('#calendar').fullCalendar('removeEvents');
                $('#calendar').fullCalendar('addEventSource', eventos);
            };

            // Redimensiona o calendário ao carregar
            $(window).on('resize', function() {
                $('#calendar').fullCalendar('option', 'height', $(window).height() - 200);
            }).trigger('resize');
        });

        // Função para filtrar o resumo financeiro
        async function filtrarResumo() {
            const mes = document.getElementById('mesResumo').value.padStart(2, '0');
            const ano = document.getElementById('anoResumo').value;
            const resumoContent = document.getElementById('resumoContent');

            // Busca todos os plantões
            const snapshot = await db.collection("plantoes").get();
            const resumoPorLocal = {};

            snapshot.forEach(doc => {
                const p = doc.data();
                // Verifica se o plantão é do mês/ano selecionado
                if (p.data && p.data.startsWith(`${ano}-${mes}`)) {
                    if (!resumoPorLocal[p.local]) {
                        resumoPorLocal[p.local] = { horas: 0, valor: 0 };
                    }
                    const horas = Number(p.tempoPlantao) || 0;
                    const valorHora = Number(p.valorHora) || 0;
                    resumoPorLocal[p.local].horas += horas;
                    resumoPorLocal[p.local].valor += horas * valorHora;
                }
            });

            // Monta o HTML do resumo
            let html = '';
            Object.keys(resumoPorLocal).forEach(local => {
                html += `
                    <div class="summary-item">
                        <h3>${local}</h3>
                        <p>Total de horas: ${resumoPorLocal[local].horas}</p>
                        <p>Valor total: R$ ${resumoPorLocal[local].valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                `;
            });

            if (!html) {
                html = `<p>Nenhum plantão encontrado para o período selecionado.</p>`;
            }

            resumoContent.innerHTML = html;
        }

        // Formulário de cadastro
        document.getElementById('plantaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = document.getElementById('data').value;
            const horaInicio = document.getElementById('horaInicio').value;
            const tempoPlantao = document.getElementById('tempoPlantao').value;
            const local = document.getElementById('local').value;
            const valorHora = document.getElementById('valorHora').value;
            const observacoes = document.getElementById('observacoes').value;

            const plantao = {
                data,
                horaInicio,
                tempoPlantao,
                local,
                valorHora,
                observacoes
            };

            try {
                const docRef = await db.collection("plantoes").add(plantao);
                alert(`Plantão cadastrado com sucesso! ID: ${docRef.id}`);
                this.reset();
            } catch (error) {
                console.error("Erro ao salvar plantão: ", error);
                alert("Erro ao salvar plantão.");
            }
        });
    </script>
</body>
</html>
