<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Plantões Médicos</title>
    <!-- load Inter from Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos gerais */
        body {
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #222;
            background: linear-gradient(180deg, #fff5f9 0%, #fff 60%);
            margin: 0;
            padding: 20px;
            font-size: 15px;
            line-height: 1.45;
        }
        h1, h2, h3 { font-weight: 700; margin: 0 0 12px 0; }
        .main-btn span { font-weight: 600; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(255, 102, 170, 0.08);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .container:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(255,102,170,0.08); }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            opacity: 0.95;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        #calendar {
            width: 100%;
            /* altura mínima maior para evitar corte das linhas do mês */
            min-height: 520px;
            /* permite rolagem se necessário e evita que elementos sejam escondidos */
            overflow: auto;
            z-index: 1;
        }
        .tab-content {
            overflow: auto;
        }
        .summary-header {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            align-items: end;
            margin-bottom: 20px;
            width: 100%;
            justify-items: stretch;
        }
        .summary-header .form-group {
            margin-bottom: 0;
        }
        .summary-item {
            margin-bottom: 20px;
            background: linear-gradient(180deg,#fff,#fffaf6);
            padding:14px;
            border-radius:10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
        }

        /* Página inicial */
        #inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 40px 0;
        }
        #inicio h2 {
            margin-bottom: 20px;
        }
        .main-btns {
            display:flex;
            gap:18px;
            flex-wrap:wrap;
        }
        .main-btn {
            background: linear-gradient(90deg,#ff7bb3 0%, #ff4d94 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 180px;
            min-height: 100px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            box-shadow: 0 8px 20px rgba(255,77,148,0.12);
            cursor:pointer;
            transition: transform .14s ease, box-shadow .14s ease, opacity .14s;
            text-decoration: none;
        }
        .main-btn svg { filter: drop-shadow(0 6px 18px rgba(255,77,148,0.12)); }
        .main-btn span { margin-top:10px; font-weight:600; font-size:15px; }

        /* hover / active */
        .main-btn:hover { transform: translateY(-4px); box-shadow: 0 22px 40px rgba(255,77,148,0.14); }
        .main-btn:active { transform: translateY(-1px); }

        /* secondary logout button */
        button.logout-btn {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.08);
            color: #333;
            padding:8px 12px;
            border-radius:10px;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            form {
                grid-template-columns: 1fr; /* Ajusta para uma única coluna */
            }
            .summary-header {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .main-btns {
                flex-direction: column;
                gap: 20px;
            }
            #calendar {
                height: 400px; /* Reduz a altura do calendário em telas menores */
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px; /* Reduz o tamanho do título */
            }
            button {
                font-size: 14px; /* Ajusta o tamanho do botão */
                padding: 8px 10px; /* Ajusta o espaçamento do botão */
            }
            .main-btns button {
                font-size: 15px;
                padding: 12px 10px;
            }
        }

        /* Estilos para a tela de login */
        #login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #login div {
            background: white;
            padding: 32px 24px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            min-width: 320px;
        }
        #login h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        #login button {
            width: 100%;
        }
        #loginErro {
            color: red;
            margin-top: 12px;
            text-align: center;
        }

        /* --- adicione ao final do <style> existente --- */
.resumo-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.summary-item table {
    font-size: 13px;            /* reduz um pouco a fonte */
    table-layout: fixed;        /* ajuda a manter colunas estáveis */
    min-width: 640px;          /* força scroll horizontal em telas pequenas */
    width: 100%;
}
.summary-item th, .summary-item td {
    padding: 6px;
    text-align: left;
    vertical-align: middle;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* torno a coluna "Entrada" e "Horas" menores */
.summary-item th:nth-child(2),
.summary-item td:nth-child(2) {
    width: 90px;       /* largura fixa para a coluna Entrada */
    max-width: 90px;
    text-align: center;
    font-size: 13px;
}

.summary-item th:nth-child(3),
.summary-item td:nth-child(3) {
    width: 70px;        /* largura fixa para a coluna Horas */
    max-width: 70px;
    text-align: center; /* centraliza o número de horas */
    white-space: nowrap;
    font-size: 13px;
}

/* responsivo: reduz ainda mais em telas pequenas */
@media (max-width: 768px) {
    .summary-item table { font-size: 12px; min-width: 520px; }
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) {
        width: 64px;
        max-width: 64px;
        font-size: 12px;
    }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) {
        width: 56px;
        max-width: 56px;
        font-size: 12px;
    }
}
@media (max-width: 480px) {
    .summary-item table { font-size: 11px; min-width: 420px; }
    .summary-item th:nth-child(2),
    .summary-item td:nth-child(2) {
        width: 56px;
        max-width: 56px;
        font-size: 11px;
    }
    .summary-item th:nth-child(3),
    .summary-item td:nth-child(3) {
        width: 48px;
        max-width: 48px;
        font-size: 11px;
    }
}
/* --- fim --- */
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" />
</head>
<body>
    <!-- Tela de Login (fora da .container) -->
    <div id="login" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh;">
        <div style="background:white; padding:32px 24px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.08); min-width:320px;">
            <h2 style="text-align:center; margin-bottom:24px;">Login</h2>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="loginEmail">E-mail:</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group" style="margin-bottom:24px;">
                    <label for="loginSenha">Senha:</label>
                    <input type="password" id="loginSenha" required>
                </div>
                <button type="submit" style="width:100%;">Entrar</button>
            </form>
            <div id="loginErro" style="color:red; margin-top:12px; text-align:center;"></div>
        </div>
    </div>

    <!-- App principal -->
    <div class="container" style="display:none;">
        
        <!-- Página Inicial -->
        <div id="inicio" style="display:none;">
            <h2>Bem-vindo! O que deseja fazer?</h2>
            <div class="main-btns">
                <button class="main-btn" onclick="mostrarSecao('cadastro')" title="Cadastrar Novo Plantão">
                    <!-- ícone plus moderno -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="11" y="4" width="2" height="16" rx="1" fill="#fff"/>
                        <rect x="4" y="11" width="16" height="2" rx="1" fill="#fff"/>
                    </svg>
                    <span>Cadastrar</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('calendario')" title="Ver Calendário">
                    <!-- novo ícone calendário (outline mais moderno) -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 2v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="6" width="18" height="15" rx="2" stroke="rgba(255,255,255,0.14)" fill="rgba(255,255,255,0.06)"/>
                        <path d="M8 11h2M8 15h2M12 11h4M12 15h4" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Calendário</span>
                </button>

                <button class="main-btn" onclick="mostrarSecao('resumo')" title="Financeiro">
                    <!-- ícone cifrão moderno (substituído) -->
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="rgba(255,255,255,0.08)"/>
                        <path d="M12 7v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 15v2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 8.5c-1-.8-2.5-1-3.5-1-1 0-2.3.3-3.3 1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9 15.5c1 .8 2.5 1 3.5 1 1 0 2.3-.3 3.3-1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Financeiro</span>
                </button>
            </div>
            <button onclick="firebase.auth().signOut()" class="logout-btn" style="float:right; margin-top:-10px;">Sair</button>
        </div>
        
        <!-- Seção de Cadastro -->
        <div id="cadastro" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Cadastrar Novo Plantão</h2>
            <form id="plantaoForm">
                <div class="form-group">
                    <label for="data">Data:</label>
                    <input type="date" id="data" required>
                </div>
                <div class="form-group">
                    <label for="horaInicio">Hora de Início:</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div class="form-group">
                    <label for="tempoPlantao">Tempo de Plantão (horas):</label>
                    <input type="number" id="tempoPlantao" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="local">Local:</label>
                    <select id="local" required>
                        <option value="Intermedica Diadema">Intermedica Diadema</option>
                        <option value="Beneficência Portuguesa SC">Beneficência Portuguesa SC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="valorHora">Valor por Hora (R$):</label>
                    <input type="number" id="valorHora" step="0.01" required>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="valorCheioCheck" style="width:auto;">
                    <label for="valorCheioCheck" style="margin:0;">Informar valor cheio do plantão</label>
                </div>
                <div class="form-group" id="valorCheioGroup" style="display:none;">
                    <label for="valorCheio">Valor Cheio do Plantão (R$):</label>
                    <input type="number" id="valorCheio" step="0.01">
                </div>
                <div class="form-group full-width">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" rows="3" style="width: 100%;"></textarea>
                </div>
                <div class="form-group full-width">
                    <button type="submit">Salvar Plantão</button>
                </div>
            </form>
        </div>
        
        <!-- Seção de Calendário -->
        <div id="calendario" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Calendário de Plantões</h2>
            <div id="calendar"></div>
        </div>
        
        <!-- Seção de Resumo Financeiro -->
        <div id="resumo" style="display:none;">
            <button onclick="mostrarSecao('inicio')" style="margin-bottom:20px;">&larr; Voltar</button>
            <h2>Resumo Financeiro Mensal</h2>
            <div class="summary-header">
                <div class="form-group">
                    <label for="mesResumo">Selecione o Mês:</label>
                    <select id="mesResumo">
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="anoResumo">Ano:</label>
                    <select id="anoResumo">
                        <option value="2023">2023</option>
                        <option value="2024" selected>2024</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
                <button onclick="filtrarResumo()">Filtrar</button>
            </div>
            <div id="resumoContent">
                <!-- Aqui será carregado o resumo financeiro -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/locale/pt-br.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script>
        // Função para navegação entre seções
        function mostrarSecao(secao) {
            document.getElementById('inicio').style.display = (secao === 'inicio') ? 'flex' : 'none';
            document.getElementById('cadastro').style.display = (secao === 'cadastro') ? 'block' : 'none';
            document.getElementById('calendario').style.display = (secao === 'calendario') ? 'block' : 'none';
            document.getElementById('resumo').style.display = (secao === 'resumo') ? 'block' : 'none';
            // Atualiza o calendário ao entrar na tela
            if (secao === 'calendario' && window.atualizarCalendario) {
                window.atualizarCalendario();
            }
            // Atualiza o resumo ao entrar na tela
            if (secao === 'resumo') {
                setResumoDefaults(); // <-- define mês/ano atual antes de filtrar
                filtrarResumo();
            }
            if (secao === 'inicio') {
                plantaoEditandoId = null;
            }
        }

        // Inicialização do Firebase usando a API compatível
        const firebaseConfig = {
            apiKey: "AIzaSyCPCsCD_UwBk_c4weCgTi8r0JyhdQThrZQ",
            authDomain: "mywebshift.firebaseapp.com",
            projectId: "mywebshift",
            storageBucket: "mywebshift.appspot.com",
            messagingSenderId: "994220258656",
            appId: "1:994220258656:web:4686ab749f948e3ae19a05",
            measurementId: "G-LF8XYGQ7M2"
        };

        firebase.initializeApp(firebaseConfig);
        firebase.analytics();
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Controle de exibição: só mostra o app se estiver logado
        function mostrarAppLogado(logado) {
            document.getElementById('login').style.display = logado ? 'none' : 'flex';
            document.querySelector('.container').style.display = logado ? 'block' : 'none';
            if (logado) {
                mostrarSecao('inicio');
            }
        }

        // Verifica se está logado ao carregar
        auth.onAuthStateChanged(function(user) {
            mostrarAppLogado(!!user);
        });

        // Função para buscar plantões do Firestore e formatar para o calendário
        async function buscarPlantoes() {
            const user = firebase.auth().currentUser;
            if (!user) return [];
            const snapshot = await db.collection("plantoes").where("userId", "==", user.uid).get();
            const eventos = [];
            snapshot.forEach(doc => {
                const p = doc.data();
                eventos.push({
                    id: doc.id, // Inclui o ID do documento
                    title: `Plantão - ${p.local}`,
                    start: `${p.data}T${p.horaInicio}`,
                    end: moment(`${p.data}T${p.horaInicio}`).add(Number(p.tempoPlantao), 'hours').format('YYYY-MM-DDTHH:mm'),
                    local: p.local,
                    valorHora: p.valorHora,
                    horas: p.tempoPlantao,
                    total: (Number(p.valorHora) * Number(p.tempoPlantao)).toFixed(2),
                    observacoes: p.observacoes
                });
            });
            return eventos;
        }

        // Inicializa o calendário
        $(document).ready(function() {
            // calcula altura inicial (garante um mínimo)
            const initialCalendarHeight = Math.max(520, $(window).height() - 220);

            // Inicializa o calendário vazio com height fixo calculado
            $('#calendar').fullCalendar({
                locale: 'pt-br',
                header: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'month,agendaWeek,agendaDay'
                },
                defaultView: 'month',
                editable: false,
                eventLimit: true,
                events: [],
                height: initialCalendarHeight,
                eventClick: function(calEvent, jsEvent, view) {
                    const confirmacao = `
                        <div style="text-align: center;">
                            <p>Plantão: ${calEvent.title}</p>
                            <p>Local: ${calEvent.local}</p>
                            <p>Valor por hora: R$ ${calEvent.valorHora}</p>
                            <p>Total: R$ ${calEvent.total}</p>
                            ${calEvent.observacoes ? `<p>Observações: ${calEvent.observacoes}</p>` : ''}
                            <button onclick="editarPlantao('${calEvent.id}')">✏️ Editar</button>
                            <button onclick="excluirPlantao('${calEvent.id}')">🗑️ Excluir</button>
                            <button onclick="fecharPopup()">Cancelar</button>
                        </div>
                    `;
                    const modal = document.createElement('div');
                    modal.style.position = 'fixed';
                    modal.style.top = '50%';
                    modal.style.left = '50%';
                    modal.style.transform = 'translate(-50%, -50%)';
                    modal.style.background = 'white';
                    modal.style.padding = '20px';
                    modal.style.borderRadius = '8px';
                    modal.style.boxShadow = '0 0 10px rgba(0,0,0,0.1)';
                    modal.style.zIndex = '9999'; // Garante que o modal fique acima de outros elementos
                    modal.innerHTML = confirmacao;

                    modal.id = 'popupModal'; // Adiciona um ID ao modal para facilitar a manipulação
                    document.body.appendChild(modal);
                }
            });

            // Função global para atualizar o calendário ao entrar na tela
            window.atualizarCalendario = async function() {
                const eventos = await buscarPlantoes();
                $('#calendar').fullCalendar('removeEvents');
                $('#calendar').fullCalendar('addEventSource', eventos);
            };

            // Ajusta altura do calendário ao redimensionar a janela (mantém mínimo)
            $(window).on('resize', function() {
                const h = Math.max(520, $(window).height() - 220);
                try {
                    $('#calendar').fullCalendar('option', 'height', h);
                    $('#calendar').fullCalendar('render');
                } catch (e) {
                    console.warn('Erro ao ajustar altura do FullCalendar:', e);
                }
            }).trigger('resize');
        });

        // Função para filtrar o resumo financeiro
        async function filtrarResumo() {
            const mes = document.getElementById('mesResumo').value.padStart(2, '0');
            const ano = document.getElementById('anoResumo').value;
            const resumoContent = document.getElementById('resumoContent');
            const user = firebase.auth().currentUser;
            if (!user) {
                resumoContent.innerHTML = "<p>Usuário não autenticado.</p>";
                return;
            }

            // Busca apenas os plantões do usuário logado
            const snapshot = await db.collection("plantoes").where("userId", "==", user.uid).get();
            const resumoPorLocal = {};

            snapshot.forEach(doc => {
                const p = doc.data();
                if (p.data && p.data.startsWith(`${ano}-${mes}`)) {
                    if (!resumoPorLocal[p.local]) {
                        resumoPorLocal[p.local] = { horas: 0, valor: 0, plantoes: [] };
                    }
                    const horas = Number(p.tempoPlantao) || 0;
                    const valorHora = Number(p.valorHora) || 0;
                    const valorTotal = p.valorTotal !== undefined ? Number(p.valorTotal) : (horas * valorHora);
                    resumoPorLocal[p.local].horas += horas;
                    resumoPorLocal[p.local].valor += valorTotal;
                    resumoPorLocal[p.local].plantoes.push({
                        data: p.data,
                        horaInicio: p.horaInicio || '',
                        tempoPlantao: horas,
                        valorTotal: valorTotal
                    });
                }
            });

            let html = '';
            Object.keys(resumoPorLocal).forEach(local => {
                // ordenar plantoes por data asc e entrada asc
                resumoPorLocal[local].plantoes.sort((a, b) => {
                    if (a.data !== b.data) return a.data.localeCompare(b.data);
                    return (a.horaInicio || '').localeCompare(b.horaInicio || '');
                });

                html += `
                    <div class="summary-item">
                        <h3>${local}</h3>
                        <div class="resumo-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Dia</th>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Entrada</th>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Horas</th>
                                        <th style="border-bottom:1px solid #ccc; padding:4px;">Valor Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${resumoPorLocal[local].plantoes.map(p => `
                                        <tr>
                                            <td style="padding:4px;">${p.data.split('-').reverse().join('/')}</td>
                                            <td style="padding:4px;">${p.horaInicio || '-'}</td>
                                            <td style="padding:4px; text-align:center;">${p.tempoPlantao}</td>
                                            <td style="padding:4px;">${p.valorTotal ? 'R$ ' + Number(p.valorTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2}) : '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <p><strong>Total de horas:</strong> ${resumoPorLocal[local].horas}</p>
                        <p><strong>Valor total:</strong> R$ ${resumoPorLocal[local].valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                `;
            });

            if (!html) {
                html = `<p>Nenhum plantão encontrado para o período selecionado.</p>`;
            }

            resumoContent.innerHTML = html;
        }

        // Formulário de cadastro
        document.getElementById('plantaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = document.getElementById('data').value;
            const horaInicio = document.getElementById('horaInicio').value;
            const tempoPlantao = document.getElementById('tempoPlantao').value;
            const local = document.getElementById('local').value;
            const valorHora = document.getElementById('valorHora').value;
            const valorCheioCheck = document.getElementById('valorCheioCheck').checked;
            const valorCheio = document.getElementById('valorCheio').value;
            const observacoes = document.getElementById('observacoes').value;

            const user = firebase.auth().currentUser;
            if (!user) {
                alert("Usuário não autenticado!");
                return;
            }

            let valorTotal;
            let valorHoraFinal = valorHora;

            if (valorCheioCheck && valorCheio) {
                valorTotal = Number(valorCheio);
                // Garante que valorHora seja recalculado corretamente
                valorHoraFinal = (Number(valorCheio) / Number(tempoPlantao)).toFixed(2);
            } else {
                valorTotal = Number(valorHora) * Number(tempoPlantao);
            }

            const plantao = {
                data,
                horaInicio,
                tempoPlantao,
                local,
                valorHora: valorHoraFinal,
                valorCheio: valorCheioCheck && valorCheio ? Number(valorCheio) : null,
                valorTotal,
                observacoes,
                userId: user.uid
            };

            try {
                if (plantaoEditandoId) {
                    // Atualiza o plantão existente
                    await db.collection("plantoes").doc(plantaoEditandoId).update(plantao);
                    console.log("Plantão atualizado com sucesso!");
                    plantaoEditandoId = null; // Limpa o modo edição
                } else {
                    // Cria um novo plantão
                    await db.collection("plantoes").add(plantao);
                    console.log("Plantão cadastrado com sucesso!");
                }
                this.reset();
                document.getElementById('valorCheioGroup').style.display = 'none';
                document.getElementById('valorHora').disabled = false;
                mostrarSecao('calendario');
                window.atualizarCalendario();
            } catch (error) {
                console.error("Erro ao salvar plantão: ", error);
            }
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            const erroDiv = document.getElementById('loginErro');
            erroDiv.textContent = '';
            try {
                await auth.signInWithEmailAndPassword(email, senha);
                // O onAuthStateChanged já cuida da navegação
            } catch (error) {
                erroDiv.textContent = 'E-mail ou senha inválidos.';
            }
        });

        // Função para definir o valor por hora automaticamente
        function atualizarValorHora() {
            const data = document.getElementById('data').value;
            const local = document.getElementById('local').value;
            const valorHoraInput = document.getElementById('valorHora');

            if (!data || !local) {
                valorHoraInput.value = '';
                return;
            }

            // Descobre o dia da semana (0=Domingo, 6=Sábado)
            const partes = data.split('-');
            const dataObj = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
            const diaSemana = dataObj.getDay();

            let valor = '';
            if (local === 'Intermedica Diadema') {
                valor = (diaSemana === 0 || diaSemana === 6) ? 125 : 114;
            } else if (local === 'Beneficência Portuguesa SC') {
                valor = (diaSemana === 0 || diaSemana === 6) ? 135 : 125;
            }
            valorHoraInput.value = valor;
        }

        // Adiciona listeners para atualizar o valor ao mudar data ou local
        document.getElementById('data').addEventListener('change', atualizarValorHora);
        document.getElementById('local').addEventListener('change', atualizarValorHora);

        let plantaoEditandoId = null;

        async function editarPlantao(id) {
            fecharPopup();
            plantaoEditandoId = id; // <-- Aqui

            const doc = await db.collection("plantoes").doc(id).get();
            const plantao = doc.data();

            if (!plantao) {
                alert("Plantão não encontrado!");
                return;
            }

            document.getElementById('data').value = plantao.data;
            document.getElementById('horaInicio').value = plantao.horaInicio;
            document.getElementById('tempoPlantao').value = plantao.tempoPlantao;
            document.getElementById('local').value = plantao.local;
            document.getElementById('valorHora').value = plantao.valorHora;
            document.getElementById('observacoes').value = plantao.observacoes;

            mostrarSecao('cadastro');
        }

        async function excluirPlantao(id) {
            if (confirm("Tem certeza que deseja excluir este plantão?")) {
                try {
                    await db.collection("plantoes").doc(id).delete();
                    // alert("Plantão excluído com sucesso!");
                    fecharPopup(); // Fecha o popup após excluir
                    window.atualizarCalendario(); // Atualiza o calendário
                } catch (error) {
                    console.error("Erro ao excluir plantão: ", error);
                    alert("Erro ao excluir plantão.");
                }
            }
        }

        function fecharPopup() {
            const modal = document.getElementById('popupModal');
            if (modal) {
                document.body.removeChild(modal);
            }
        }

        // Mostrar/ocultar campo de valor cheio e calcular valorHora automaticamente
document.getElementById('valorCheioCheck').addEventListener('change', function() {
    const valorCheioGroup = document.getElementById('valorCheioGroup');
    const valorCheioInput = document.getElementById('valorCheio');
    const valorHoraInput = document.getElementById('valorHora');
    valorCheioGroup.style.display = this.checked ? 'block' : 'none';
    valorCheioInput.required = this.checked;
    valorHoraInput.disabled = this.checked;

    if (this.checked) {
        // Se marcar, limpa o valorHora e espera o usuário preencher o valor cheio
        valorHoraInput.value = '';
    } else {
        valorCheioInput.value = '';
        valorHoraInput.disabled = false;
    }
});

// Sempre que o valor cheio ou tempo mudar, calcula o valorHora automaticamente se o checkbox estiver marcado
document.getElementById('valorCheio').addEventListener('input', function() {
    const tempo = parseFloat(document.getElementById('tempoPlantao').value);
    const valorCheio = parseFloat(this.value);
    const valorHoraInput = document.getElementById('valorHora');
    if (!isNaN(tempo) && tempo > 0 && !isNaN(valorCheio)) {
        valorHoraInput.value = (valorCheio / tempo).toFixed(2);
    }
});
document.getElementById('tempoPlantao').addEventListener('input', function() {
    const tempo = parseFloat(this.value);
    const valorCheio = parseFloat(document.getElementById('valorCheio').value);
    const valorHoraInput = document.getElementById('valorHora');
    if (document.getElementById('valorCheioCheck').checked && !isNaN(tempo) && tempo > 0 && !isNaN(valorCheio)) {
        valorHoraInput.value = (valorCheio / tempo).toFixed(2);
    }
});

// adiciona esta função no mesmo <script> (logo após mostrarSecao ou onde ficar melhor)
function setResumoDefaults() {
    const now = new Date();
    const mes = String(now.getMonth() + 1); // valores das options: "1".."12"
    const ano = String(now.getFullYear());

    const mesSelect = document.getElementById('mesResumo');
    const anoSelect = document.getElementById('anoResumo');

    if (mesSelect) {
        mesSelect.value = mes;
    }
    if (anoSelect) {
        // adiciona o ano nas options caso não exista (ex.: ano futuro)
        const exists = Array.from(anoSelect.options).some(opt => opt.value === ano);
        if (!exists) {
            const opt = document.createElement('option');
            opt.value = ano;
            opt.text = ano;
            anoSelect.appendChild(opt);
        }
        anoSelect.value = ano;
    }
}
